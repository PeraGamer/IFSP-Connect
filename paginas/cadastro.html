<div class="formu">
<h2>Realize seu cadastro:</h2>
<br>
<form>
    <p>
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" placeholder="Digite seu nome e sobrenome">
    </p>
    <p>
        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="Digite seu e-mail institucional">
    </p>
    <p>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" placeholder="Digite sua senha">
    </p>
    <p>
        <label for="curso">Selecione o curso:</label><br>
        <select id="curso">
            <option value="" selected disabled hidden>Selecione...</option>
            <option>ADS - Análise e Desenvolvimento de Sistemas</option>
            <option>TDS - Técnico em Desenvolvimento de Sistemas</option>
            <option>ECO - Engenharia da Computação</option>
            <option>AUT - Tecnologia em Automação Industrial</option>
            <option>MAT - Licenciatura em Matemática</option>
        </select>
    </p>
    <p>
        <label for="semestre">Selecione seu semestre:</label><br>
        <select id="semestre">
            <option value="" selected disabled hidden>Selecione...</option>
            <option>1° semestre</option>
            <option>2° semestre</option>
            <option>3° semestre</option>
            <option>4° semestre</option>
            <option>5° semestre</option>
            <option>6° semestre</option>
            <option>7° semestre</option>
            <option>8° semestre</option>
            <option>9° semestre</option>
            <option>10° semestre</option>
        </select>
    </p>
    <p>
        <label for="turno">Selecione seu turno:</label><br>
        <select id="turno">
            <option value="" selected disabled hidden>Selecione...</option>
            <option>Matutino</option>
            <option>Vespertino</option>
            <option>Noturno</option>
        </select>
    </p>
    <p>
        Selecione alguns de seus interesses:<br>
        <label><input type="checkbox" name="interesses" value="calculo"> Cálculo</label><br>
        <label><input type="checkbox" name="interesses" value="programacao"> Programação</label><br>
        <label><input type="checkbox" name="interesses" value="html"> HTML</label><br>
        <label><input type="checkbox" name="interesses" value="js"> JavaScript</label><br>
        <label><input type="checkbox" name="interesses" value="css"> CSS</label><br>
        <label><input type="checkbox" name="interesses" value="fisica"> Física</label><br>
        <label><input type="checkbox" name="interesses" value="tecnologia"> Tecnologia</label>
    </p>
    <p>
        <label for="sugestao">Deixe uma sugestão:</label><br>
        <textarea id="sugestao" rows="5" cols="40"></textarea>
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
</form>
